[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-app"
version = "0.1.0"
description = "BR100 ultramarathon training coach and race day engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "anthropic>=0.78.0",
    "pydantic==2.9.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "fit-tool>=0.9.13",
    "gpxpy>=1.6.0",
    "pyyaml>=6.0",
]

[project.scripts]
ultra = "backend.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Both entry points must call load_dotenv() before importing project modules:
# strava.py and intervals_icu.py read os.environ at module scope, so imports
# hoisted above the dotenv call would capture unset credentials.
"backend/cli.py" = ["E402"]
"backend/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
# Ship the bundled race data (crew protocol profile + peer-split skeleton +
# aid-station chart + official course GPX) so the documented `race crew-manual`
# and `race load-course` defaults resolve on a non-editable wheel install.
backend = ["data/*.yaml", "data/*.csv", "data/*.gpx"]
